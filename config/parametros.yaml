# Parâmetros gerais do modelo (Seção IV da proposta)
unidade_taxa: 1.0e-5        # taxas_literatura.csv está em falhas por 10^5 h
missoes_h: [1, 1000]        # um voo de 1 h e um ano de 1000 h
beta: {min: 0.01, nom: 0.10, max: 0.30}   # fração de causa comum nos pares redundantes (faixa assumida)
# Como tratar a taxa publicada do motor inteiro:
#   false -> leitura literal da proposta: toda a taxa vai para os blocos em série e os pares entram por cima
#   true  -> a taxa publicada é preservada em 1 h: os blocos em série recebem (taxa - contribuição dos pares)
calibrar_total: true
# NTSB, Events_Sequence (eventsoe_no): códigos que contam como falha de motor
eventos_falha_motor:
  341: Loss of engine power (total)
  342: Loss of engine power (partial)
  340: Powerplant sys/comp malf/fail
  343: Uncontained engine failure
  140: Engine shutdown
# Combustível: falha operacional, contada à parte (perda de potência depois de pane seca não é falha do motor)
eventos_combustivel:
  190: Fuel related
  191: Fuel starvation
  192: Fuel exhaustion
  193: Fuel contamination
  194: Wrong fuel
# Construção amadora (homebuilt): motores não certificados (Rotax, Jabiru, conversões), fora das taxas da literatura
excluir_construcao_amadora: true
# Gama-Poisson (taxas absolutas): só roda se houver exposição em horas de voo. O NTSB não traz horas voadas da frota.
exposicao_horas: {pistao: null, turboelice: null, turbofan: null}
forca_prior: 20             # pseudo-contagens do prior (literatura) na atualização das frações
